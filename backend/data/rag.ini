# rag.ini — Retrieval (RAG) Configuration
# Auto-saved by Settings UI (Retrieval (RAG) section)

[server]
base_url         = http://localhost:8000
data_endpoint    = /data
ask_endpoint     = /ask
metadata_file    = metadata.json
timeout          = 30

[storage]
upload_folder    = storage/uploads
vector_store     = storage/vectors
bm25_store       = storage/bm25

[config_paths]
instructions_file = config/instructions.md
faq_file          = config/faq.json
settings_file     = config/settings.yaml

[search]
embed_model    = bge-small-en-v1.5
chunk_size     = 512
chunk_overlap  = 64
top_k          = 8
bm25_weight    = 0.4
sem_weight     = 0.6
rerank_enabled = true
rerank_model   = bge-reranker-base
top_n          = 3

[cache]
enabled         = true
sim_threshold   = 0.92
size            = 1024
ttl             = 3600
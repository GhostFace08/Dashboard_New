# middleware.properties — Unified MCP Dashboard
#
# Cross-cutting config shared by all 6 middleware services (Observability,
# Settings, Chat, Capacity, Topology, Admin). Read once per JVM by
# MiddlewareConfig (see src/main/java/com/dashboardnew/middleware).
#
# Precedence for every setting below:
#   value here  >  matching environment variable  >  hardcoded default
#
# Nothing here is required — delete a line (or the whole file) and that
# service just falls back to its env var / default like before. Restart the
# service(s) for changes to take effect; this file is only read at startup.
#
# This file does NOT replace the *.ini files (llm.ini, rag.ini, conf.properties,
# etc.) that the Settings UI auto-saves — those still own their own
# feature-specific settings. This file is only for the plumbing (ports,
# project root, network timeouts) that isn't tied to any one settings page.

# ── Project root ─────────────────────────────────────────────────────────
# Resolved before this file is even found (MiddlewareConfig itself needs it
# to locate this file), but every service also re-reads it here for
# backend/data/*.json paths. Leave as "." to mean "wherever the JVM was
# started from" (the repo root).
mcp.root=.

# ── Ports ─────────────────────────────────────────────────────────────────
observability.port=8081
settings.port=5200
chat.port=5100
capacity.port=8082
topology.port=8083
admin.port=8086

# ── ObservabilityMiddleware ───────────────────────────────────────────────
# How often (seconds) the background poller checks all_issues.json for changes.
observability.periodic_check_seconds=300

# ── ChatMiddleware ────────────────────────────────────────────────────────
# NOTE: chat.port above is the effective fallback here; llm.ini's own
# CHAT_PORT key (if set) still wins over this file, unchanged from before.
chat.connect_timeout_ms=5000
chat.read_timeout_ms=600000

# ── TopologyMiddleware ────────────────────────────────────────────────────
topology.settings_url=http://localhost:5200
topology.connect_timeout_ms=5000
topology.read_timeout_ms=10000

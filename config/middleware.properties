# middleware.properties — Unified MCP Dashboard
#
# Cross-cutting config shared by all 6 middleware services (Observability,
# Settings, Chat, Capacity, Topology, Admin). Read once per JVM by
# MiddlewareConfig (see src/main/java/com/dashboardnew/middleware).
#
# LOCATION: this file lives at <repo root>/config/middleware.properties.
# MiddlewareConfig finds it by resolving "config/middleware.properties"
# against MCP_ROOT (below) — override the file's own location with the
# MIDDLEWARE_CONFIG_FILE env var if it needs to live somewhere else.
#
# Precedence for every setting below:
#   value here  >  matching environment variable  >  hardcoded default
# (data.* keys have no environment-variable fallback — they were plain
# hardcoded constants before this file existed.)
#
# Nothing here is required — delete a line (or the whole file) and that
# service just falls back to its env var / default like before. Restart the
# service(s) for changes to take effect; this file is only read at startup.
#
# This file does NOT replace the *.ini files (llm.ini, rag.ini, conf.properties,
# etc.) that the Settings UI auto-saves — those still own their own
# feature-specific settings. This file is only for the plumbing (ports,
# project root, data file locations, network timeouts) that isn't tied to
# any one settings page.

# ── Project root ─────────────────────────────────────────────────────────
# Leave as "." to mean "wherever the JVM was started from" (the repo root).
# Every data.dir / config.dir path below is resolved relative to this.
mcp.root=.

# ── Data & config file locations ─────────────────────────────────────────
# Folder every service's *data* files (all_issues.json, users.json, ...)
# live under, relative to mcp.root. Left as-is for now.
data.dir=backend/data
# Folder the Settings-UI-managed *settings* files (conf.properties, llm.ini,
# rag.ini, mcpconf.ini, capacity.ini, chat.ini, performance.ini,
# categorization.json, mapping.json) live under — moved into this same
# top-level config/ folder alongside middleware.properties itself.
config.dir=config

# Individual data file names (relative to data.dir). Only need to be set
# here if you want a service to read/write a file under a different name
# than the shipped default shown on the right.
data.file.all_issues=all_issues.json
data.file.infrastructure=infrastructure.json
data.file.services=services.json
data.file.chatstats=chatstats.json
data.file.users=users.json
data.file.network_devices=network-devices.json
data.file.processes=processes.json
data.file.topology=topology.json

# Individual settings file names (relative to config.dir). SettingsMiddleware's
# generic /api/config/:filename route is keyed by the filename the frontend
# already asks for, so those aren't listed here — this only covers the couple
# of settings files another middleware (ChatMiddleware) reads directly.
data.file.llm_ini=llm.ini
data.file.rag_ini=rag.ini

# ── Ports ─────────────────────────────────────────────────────────────────
observability.port=8081
settings.port=5200
chat.port=5100
capacity.port=8082
topology.port=8083
admin.port=8086

# ── ObservabilityMiddleware ───────────────────────────────────────────────
# How often (seconds) the background poller checks all_issues.json for changes.
observability.periodic_check_seconds=300

# ── ChatMiddleware ────────────────────────────────────────────────────────
# NOTE: chat.port above is the effective fallback here; llm.ini's own
# CHAT_PORT key (if set) still wins over this file, unchanged from before.
chat.connect_timeout_ms=5000
chat.read_timeout_ms=600000

# ── TopologyMiddleware ────────────────────────────────────────────────────
topology.settings_url=http://localhost:5200
topology.connect_timeout_ms=5000
topology.read_timeout_ms=10000
